<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Grocery aisle editor · Sleipnir Studio</title>
  <link rel="stylesheet" href="aisle-shelf-editor.css?v=shelf-resize-2">
<link rel="stylesheet" href="product-details-editor.css">
  <link rel="stylesheet" href="shelf-layout-canvas.css?v=1">
  <link rel="stylesheet" href="shelf-layout-controls.css?v=1">
  <link rel="stylesheet" href="shelf-layout-workspace.css?v=1"><link rel="stylesheet" href="store-toolbox-entry.css?v=1"></head>
<body>
  <header id="editor-header">
    <div><a href="store-directory.html?type=grocery" class="back-link" id="store-back">‹ Stores</a><h1>Grocery aisle editor</h1></div>
    <button type="button" id="connect-owner">Connect owner</button>
    <a href="store-directory.html?type=grocery" id="change-store">Change store</a>
  </header>
  <main id="editor-grid">
    <section id="preview-pane" aria-labelledby="preview-heading">
      <div id="preview-toolbar">
        <div class="field"><label for="department" id="preview-heading">Store aisle</label><select id="department"></select></div>
        <button type="button" id="open-layout" aria-haspopup="dialog" disabled>Aisle organizer</button>
        <button type="button" id="mode-toggle" aria-haspopup="dialog" aria-controls="shopping-preview" disabled>Preview shopping</button>
      </div>
      <div id="preview-host">
        <p id="frame-status" role="status">Loading the compiled preview…</p>
        <button type="button" id="retry-store" hidden>Retry store lookup</button>
        <iframe id="editor-frame" title="Interactive GroceryAisle Flutter preview" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer" hidden></iframe>
      </div>
      <div id="phone-size-tools"></div>
      <div class="preview-actions">
        <button type="button" id="prev-panel" aria-label="Previous shelf" disabled>‹</button>
        <form id="search-form" role="search"><input type="search" id="aisle-search" aria-label="Search products in the preview" placeholder="Find a product" disabled><button type="submit" id="search-go" disabled>Find</button></form>
        <button type="button" id="next-panel" aria-label="Next shelf" disabled>›</button>
      </div>
      <button type="button" id="inspect-selected" hidden></button>
    </section>
    <aside id="inspector" aria-label="Aisle editing controls">
      <section class="editor-card" id="product-card" aria-labelledby="product-heading">
        <h2 id="product-heading" tabindex="-1">Selected product</h2>
        <div id="product-detail" aria-live="polite"><p>Click a product on the shelf to resize it.</p></div>
        <div id="product-size-tools">
          <strong id="phone-size-product"></strong>
          <div class="control-label"><label for="scale-range">Size on shelf</label><output id="scale-value" for="scale-range">—</output></div>
          <div class="scale-controls">
            <button type="button" id="scale-minus" aria-label="Make product smaller by 10 percentage points" disabled>−10%</button>
            <input type="range" id="scale-range" min="0.5" max="1.5" step="0.01" value="1" disabled>
            <button type="button" id="scale-plus" aria-label="Make product larger by 10 percentage points" disabled>+10%</button>
          </div>
          <div class="button-row"><button type="button" id="save-scale" class="primary" disabled>Save size</button><button type="button" id="scale-reset" disabled>Reset to 100%</button></div>
          <p id="draft-status" class="field-hint" role="status"></p>
          <button type="button" id="enlarge-layout" aria-haspopup="dialog" hidden>Enlarge &amp; rearrange</button>
        </div>
        <a href="#preview-pane" id="return-preview" hidden>Back to preview</a>
      </section>
      <section class="editor-card" id="repair-card" aria-labelledby="repair-heading">
        <h2 id="repair-heading">Flag for repair</h2>
        <label for="repair-note">What needs fixing?</label>
        <textarea id="repair-note" rows="2" placeholder="Describe the issue with this product" maxlength="1000" disabled></textarea>
        <button type="button" id="flag-product" disabled>Add to repair list</button>
        <details id="repair-drawer"><summary>Repair list <span id="repair-count"></span></summary><ul id="repair-list" aria-live="polite"></ul></details>
      </section>
      <section class="editor-card" id="version-card" aria-labelledby="version-heading">
        <h2 id="version-heading">Dart versions</h2>
        <label for="version-list">Preview version</label><select id="version-list"></select>
        <p id="version-status" class="field-hint" aria-live="polite"></p>
        <details id="upload-drawer"><summary>Upload Dart</summary>
          <div class="upload-controls"><label for="dart-file">GroceryAisle source</label><input type="file" id="dart-file" accept=".dart,text/plain"><button type="button" id="upload" disabled>Save version</button></div>
        </details>
        <div class="button-row"><button type="button" id="compile-version" hidden>Build private preview</button><button type="button" id="pair-local-compiler" hidden>Pair compiler</button><a id="pairing-help" href="aisle-compiler.html" target="_blank" rel="noopener" hidden>Compiler setup</a><button type="button" id="refresh-versions" hidden>Refresh versions</button></div>
      </section>
      <p id="editor-status" role="status" aria-live="polite"></p>
    </aside>
  </main>
  <dialog id="layout-workspace" aria-labelledby="layout-heading">
    <header class="layout-top"><div><small>Aisle organizer</small><h2 id="layout-heading">Aisle</h2></div><button id="layout-close" type="button" autofocus>Back to aisle</button></header>
    <p id="layout-status" role="status"></p><button id="layout-retry" hidden type="button">Retry</button>
    <div id="layout-panels" hidden>
      <section id="layout-preview" aria-label="Shelf preview">
        <div id="layout-phone">
          <nav id="layout-groups" aria-label="Quick jump to product group"></nav>
          <div id="layout-surface" aria-label="Editable shelf"></div>
          <nav id="layout-paging" aria-label="Shelf navigation"><button type="button" id="layout-prev" aria-label="Previous bay">‹</button><span id="layout-page"></span><button type="button" id="layout-next" aria-label="Next bay">›</button></nav>
        </div>
      </section>
      <aside id="layout-inspector" aria-label="Shelf and product controls"></aside>
    </div>
  </dialog>
  <dialog id="shopping-preview" aria-labelledby="shopping-heading">
    <header><h2 id="shopping-heading">Shopping preview</h2><button type="button" id="close-shopping" autofocus>Back to editing</button></header>
    <p id="shopping-status" role="status"></p>
  </dialog>
  <script src="workspace-core.js?v=stores-20261122"></script>
  <script src="studio-transfer-config.js"></script>
  <script src="studio-auth-core.js"></script>
  <script src="studio-jobs.js"></script>
  <script src="grocery-private-build.js"></script>
  <script src="product-details-editor.js"></script><script src="shelf-layout-data.js?v=1"></script>
  <script src="shelf-layout-store.js?v=1"></script>
  <script src="shelf-layout-canvas.js?v=1"></script>
  <script src="shelf-layout-controls.js?v=1"></script>
  <script src="shelf-layout-workspace.js?v=1"></script>
  <script src="aisle-shelf-editor.js?v=shelf-layout-1"></script>
<script src="store-toolbox-entry.js?v=1"></script></body>
</html>
