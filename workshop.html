<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleipnir Workshop</title>
<style>
:root{--bg:#0e1316;--panel:#13191d;--line:#26323a;--text:#e6eef0;--dim:#8fa3ab;--acc:#7fe3e0;--gold:#e9c46a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
header{height:44px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#10161a}
.brand{width:200px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:800;letter-spacing:.12em;font-size:13px;border-right:1px solid var(--line)}
.brand i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--acc);color:#05201f;font-size:15px}
.areas{display:flex;flex:1}
.area{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);padding:0 30px;font-size:15px;font-weight:600;cursor:pointer}
.area:hover{color:var(--text);background:#151d22}.area.on{color:#05201f;background:var(--acc)}
.hdr-right{display:flex;align-items:center;gap:8px;padding:0 14px}
.hdr-right a{color:var(--dim);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:6px 10px;border-radius:6px}
.hdr-right a:hover{color:var(--text)}
main{height:calc(100% - 44px);display:grid;grid-template-columns:200px 1fr}
nav.pages{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 8px 30px}
.cap{font-size:11px;letter-spacing:.14em;color:var(--dim);padding:10px 8px 8px}
.pg{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);border-radius:7px;padding:11px 10px;font-size:14px;cursor:pointer;margin-bottom:2px}
.pg small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.pg:hover{background:#1a242b}.pg.on{background:#1d2b31;border-color:#2e6b6a}
.pg[disabled]{opacity:.45;cursor:default}
.drill{margin:4px 4px 10px 10px;padding:8px 0 4px 10px;border-left:2px solid #2e6b6a;display:flex;flex-direction:column;gap:8px}
.drill label{font-size:11px;color:var(--dim);letter-spacing:.06em}
.drill select{width:100%;background:#0f1519;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;margin-top:3px}
.drill .count{font-size:11px;color:var(--dim)}
.note{color:var(--dim);font-size:12px;padding:6px 10px}
.frame{position:relative;min-width:0}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:40px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="brand"><i>ᛋ</i>WORKSHOP</div>
  <nav class="areas" id="areas" aria-label="App areas"></nav>
  <div class="hdr-right"><a href="index.html" title="The studio as it was">Classic studio</a></div>
</header>
<main>
  <nav class="pages" id="pages" aria-label="Pages in this area"></nav>
  <section class="frame"><iframe id="ed" title="Editor"></iframe><div class="empty" id="empty" hidden></div></section>
</main>
<script src="workshop.js?v=area-tabs-20261114a"></script>
</body>
</html>
