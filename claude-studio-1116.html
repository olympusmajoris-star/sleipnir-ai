<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleipnir Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Oswald:wght@400;600;700&family=Bebas+Neue&family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1215;--panel:#131a1e;--panel2:#182126;--line:#28353d;--text:#e8eff1;--dim:#8ea2aa;--acc:#7fe3e0;--blue:#39a7ff;--orange:#ff8a3d;--gold:#e9c46a}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* 1 — main areas */
header{height:50px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#10161a}
.brand{width:210px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800;letter-spacing:.12em;font-size:12px;border-right:1px solid var(--line)}
.brand i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--acc);color:#05201f;font-size:15px}
#areas{display:flex;flex:1}
#areas button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);padding:0 34px;font-size:16px;font-weight:700}
#areas button:hover{color:var(--text);background:#151d22}
#areas button.on{color:#05201f;background:var(--acc)}
.hdr-right{display:flex;align-items:center;gap:8px;padding:0 12px}
.hdr-right a{color:var(--dim);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:6px 10px;border-radius:6px}
main{height:calc(100% - 50px);display:grid;grid-template-columns:210px minmax(0,1fr)}
/* 2 — pages column */
#left{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 8px 40px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;padding:4px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.crumb button{background:#0f1519;border:1px solid var(--line);border-radius:5px;color:var(--acc);font-size:11px;padding:4px 7px}
.cap{font-size:10px;letter-spacing:.14em;color:var(--dim);padding:6px 6px 6px;text-transform:uppercase}
.pg{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:7px;padding:9px 9px;font-size:13.5px;margin-bottom:2px}
.pg small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.pg:hover{background:#1a242b}.pg.on{background:#1d2b31;border-color:#2e6b6a}
.pg .n{float:right;color:var(--dim);font-size:11px}
#find{width:100%;background:#0f1519;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 8px;margin-bottom:6px;font-size:13px}
/* work area */
#work{min-width:0;min-height:0;position:relative}
#frameWrap{position:absolute;inset:0;display:flex;flex-direction:column}
#frameBar{height:30px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line);background:#10161a}
#frame{flex:1;border:0;width:100%;background:var(--bg)}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:40px}
#empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
#editor{position:absolute;inset:0;display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr)}
/* phone */
#phoneCol{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0a0e10}
#phoneBar{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
#phoneBar button{background:#0f1519;border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--text)}
#phoneBar button.on{background:var(--acc);color:#05201f;border-color:var(--acc)}
#phoneBar .sp{flex:1}
#phoneHold{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:6px}
#phoneScale{transform-origin:top center}
#phone{width:390px;height:844px;border-radius:34px;border:3px solid #2b363c;background:#000;overflow:hidden;position:relative;box-shadow:0 20px 60px #000a}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#scroll::-webkit-scrollbar{display:none}
#stage{position:relative;width:390px;font-family:Roboto,system-ui,sans-serif;color:#fff;user-select:none}
.el{position:absolute}
.el img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.fit{position:relative}
.fit>.fin{position:absolute;left:0;top:0;transform-origin:0 0}
.t{position:relative;display:block;white-space:pre-wrap}
.t.one{white-space:nowrap}
.row{display:flex;align-items:center}
body:not(.clean) [data-el]{cursor:pointer}
body:not(.clean) [data-el].kindOn{outline:1px dashed rgba(127,227,224,.55);outline-offset:1px}
body:not(.clean) [data-el]:hover{outline:1px solid rgba(255,255,255,.6);outline-offset:1px}
body:not(.clean) [data-el].sel{outline:2px solid var(--orange)!important;outline-offset:1px}
#handle{position:absolute;width:16px;height:16px;border-radius:4px;background:var(--orange);border:2px solid #fff;z-index:50;cursor:nwse-resize;touch-action:none}
body.clean #handle{display:none}
#cutBox{position:absolute;border:2px dashed var(--orange);background:rgba(255,138,61,.15);z-index:60;pointer-events:none}
/* 3 — features */
#right{display:flex;flex-direction:column;min-width:0;min-height:0}
#features{flex:none;display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);background:#10161a;min-height:40px}
#features button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);padding:0 14px;height:40px;white-space:nowrap;font-size:13px;font-weight:600}
#features button:hover{color:var(--text)}
#features button.on{color:#05201f;background:var(--gold)}
/* 5 — orange area */
#edit{flex:1;min-height:0;margin:10px;border:2px solid var(--orange);border-radius:10px;display:flex;flex-direction:column;background:var(--panel)}
#target{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
#target b{color:var(--orange)}
#target select{background:#0f1519;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px}
#target .sp{flex:1}
.tb{background:#0f1519;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px}
.tb:hover{border-color:var(--acc)}.tb:disabled{opacity:.4;cursor:default}
.tb.save{background:var(--acc);color:#05201f;border-color:var(--acc);font-weight:700}
.tb.save.dirty{background:var(--orange);border-color:var(--orange);color:#201000}
#body{flex:1;min-height:0;display:flex}
/* 4 — options column */
#options{width:150px;flex:none;border:2px solid var(--blue);border-radius:8px;margin:8px;overflow:auto;padding:4px}
#options button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 9px;font-size:13.5px}
#options button:last-child{border-bottom:0}
#options button:hover{background:#1a242b;color:var(--acc)}
#controls{flex:1;min-width:0;overflow:auto;padding:10px 12px 30px}
#controls h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.hint{color:var(--dim);font-size:12.5px;padding:18px 10px;line-height:1.6}
.boxes{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.cbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:300px;max-width:100%}
.cbox h4{margin:0 0 7px;font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--dim);color:var(--dim);font-size:10px;cursor:help;text-transform:none;letter-spacing:0}
.ctl{display:grid;grid-template-columns:78px 1fr 62px 22px;gap:6px;align-items:center;margin:5px 0;font-size:12.5px}
.ctl input[type=range]{width:100%;accent-color:var(--orange)}
.ctl input[type=number],.ctl input[type=text],.ctl select{width:100%;background:#0f1519;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 5px;font-size:12px}
.ctl input[type=color]{width:100%;height:26px;background:none;border:1px solid var(--line);border-radius:5px;padding:0}
.ctl .wide{grid-column:2 / span 2}
.ctl .rs{background:none;border:0;color:var(--dim);font-size:13px;padding:0}
.ctl .rs:hover{color:var(--orange)}
.ctl label{color:var(--dim)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1519;border:1px solid var(--acc);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;z-index:99}
</style>
</head>
<body>
<header>
  <div class="brand"><i>ᛋ</i>STUDIO</div>
  <nav id="areas" aria-label="Main areas"></nav>
  <div class="hdr-right"><a href="workshop.html" title="ChatGPT's workshop, unchanged">Workshop</a></div>
</header>
<main>
  <nav id="left" aria-label="Pages"></nav>
  <section id="work">
    <div id="empty"><div><b>Pick a page on the left</b>The page opens here exactly as it looks in the app, with every piece ready to edit.</div></div>
    <div id="frameWrap" hidden><iframe id="frame" title="Page editor"></iframe></div>
    <div id="editor" hidden>
      <div id="phoneCol">
        <div id="phoneBar" hidden><span id="pageName"></span></div>
        <div id="phoneHold"><div id="phoneScale"><div id="phone"><div id="scroll"><div id="stage"></div></div></div></div></div>
      </div>
      <div id="right">
        <div id="features" aria-label="Features of this page"></div>
        <div id="edit">
          <div id="target">
            <button class="tb" id="bBack" title="Go back one step">← Back</button>
            <span id="targetText"></span>
            <select id="scope" title="What this change applies to"></select>
            <span class="sp"></span>
            <button class="tb" id="bUndo" title="Undo the last change">Undo</button>
            <button class="tb" id="bRedo" title="Redo">Redo</button>
            <button class="tb" id="bPreview" title="Hide outlines and see the page clean">Preview</button>
            <button class="tb save" id="bSave" title="Save to the shared studio">Save</button>
          </div>
          <div id="body"><div id="options" aria-label="What to adjust"></div><div id="controls"></div></div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="toast" hidden></div>
<script src="studio-transfer-config.js"></script>
<script>
'use strict';
/* ============ shared access ============ */
const CFG = window.StudioTransferConfig || {};
const SB = CFG.url, KEY = CFG.key;
const HEAD = { apikey: KEY, Authorization: 'Bearer ' + KEY };
async function rest(path, opt){
  const r = await fetch(SB + '/rest/v1/' + path, Object.assign({ headers: HEAD }, opt || {}));
  if(!r.ok) throw new Error(path.split('?')[0] + ' ' + r.status + ' ' + (await r.text()).slice(0, 160));
  const body = await r.text(); return body ? JSON.parse(body) : null;
}
async function restAll(path){ // paged read
  let out = [], from = 0; const step = 1000;
  for(;;){
    const r = await fetch(SB + '/rest/v1/' + path, { headers: Object.assign({ Range: from + '-' + (from + step - 1), 'Range-Unit': 'items' }, HEAD) });
    if(!r.ok) throw new Error(path.split('?')[0] + ' ' + r.status);
    const rows = await r.json(); out = out.concat(rows);
    if(rows.length < step) return out; from += step;
  }
}
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const h = (tag, props, kids) => { const e = document.createElement(tag); Object.assign(e, props || {}); for(const k of [].concat(kids || [])) e.append(k); return e; };
const deep = o => JSON.parse(JSON.stringify(o));
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms || 2600); }

/* ============ 1 + 2: areas and pages ============ */
const AREAS = {
  Sleipnir: [
    { id:'shome', name:'Shopping home', sub:'Home page for delivery stores', url:'pages.html?page=shome' },
    { id:'stores', name:'Stores', sub:'Town → type → store → its pages', drill:'stores' },
    { id:'b_grocery', name:'Grocery list page', sub:'Store browsing', url:'pages.html?page=browse&type=grocery' },
    { id:'b_retail', name:'Retail list page', sub:'Store browsing', url:'pages.html?page=browse&type=retail' },
    { id:'b_ff', name:'Fast food list page', sub:'Store browsing', url:'pages.html?page=browse&type=fast_food' },
    { id:'b_rest', name:'Restaurant list page', sub:'Store browsing', url:'pages.html?page=browse&type=restaurant' },
    { id:'b_val', name:'Valhalla', sub:'Streets and storefronts', url:'pages.html?page=browse&type=valhalla' },
    { id:'deals', name:'Deals', sub:'Offers', url:'pages.html?page=deals' },
    { id:'track', name:'Order tracking', sub:'Tracking screen', url:'pages.html?page=track' }
  ],
  Asgard: [
    { id:'raven', name:'Raven', sub:'Black holes, sphere, favorites', url:'index.html' },
    { id:'rocks', name:'Floating navigation', sub:'Carved rocks', url:'index.html?section=rocks' },
    { id:'home', name:'Home & posts', sub:'Feed', url:'pages.html?page=home' },
    { id:'convo', name:'Messages', sub:'Clouds, Earth, words', url:'pages.html?page=convo' },
    { id:'effects', name:'Cloud motion', sub:'Construction & clouds', url:'studio-effects.html' },
    { id:'share', name:'Share', sub:'Water, figures', url:'pages.html?page=share' },
    { id:'swap', name:'Swap & sell', sub:'Marketplace', url:'pages.html?page=swap' },
    { id:'shoppost', name:'Shop the post', sub:'Product tags', url:'pages.html?page=shoppost' },
    { id:'ads', name:'Ads', sub:'Ad cards', url:'pages.html?page=ads' },
    { id:'heimdall', name:'Notifications', sub:'Heimdall', url:'pages.html?page=heimdall' }
  ]
};
const TYPES = [['fast_food','Fast food'],['fast_casual','Fast casual'],['sit_down','Sit-down restaurants'],['grocery','Grocery'],['retail','Retail'],['valhalla','Valhalla (local)']];
const NAV = { area: 'Sleipnir', path: [], page: null, find: '' };   // path = drill steps inside Stores
const DATA = { stores: null, boards: null };

function storeType(s){
  if(s.is_valhalla) return 'valhalla';
  if(/grocer|supermarket/i.test(s.category || '')) return 'grocery';
  return s.menu_type || 'retail';
}
function storeTown(s){ const m = /,\s*([A-Za-z .']+),\s*FL/.exec(s.address || ''); return m ? m[1].trim() : 'No town listed'; }
async function loadStores(){
  if(DATA.stores) return;
  const [stores, panels] = await Promise.all([
    restAll('stores?select=id,name,address,category,menu_type,is_valhalla&order=name'),
    restAll('store_board_panels?select=store_id,panel_no,daypart,mode&order=daypart,panel_no')
  ]);
  DATA.stores = stores; DATA.boards = {};
  for(const p of panels) (DATA.boards[p.store_id] = DATA.boards[p.store_id] || []).push(p);
}

function drawAreas(){
  const n = $('#areas'); n.textContent = '';
  for(const a of Object.keys(AREAS)) n.append(h('button', { textContent: a, className: a === NAV.area ? 'on' : '', onclick: () => { if(!leaveOk()) return; NAV.area = a; NAV.path = []; NAV.page = null; NAV.find = ''; closeWork(); drawAreas(); drawLeft(); } }));
}
function pgBtn(name, sub, on, click, count){
  const b = h('button', { className: 'pg' + (on ? ' on' : ''), onclick: click });
  if(count != null) b.append(h('span', { className: 'n', textContent: count }));
  b.append(name); if(sub) b.append(h('small', { textContent: sub })); return b;
}
async function drawLeft(){
  const L = $('#left'); L.textContent = '';
  if(!NAV.path.length){
    L.append(h('div', { className: 'cap', textContent: NAV.area + ' pages' }));
    for(const p of AREAS[NAV.area]) L.append(pgBtn(p.name, p.sub, NAV.page === p.id, () => { if(!leaveOk()) return; if(p.drill){ NAV.path = [{ k:'stores', label:'Stores' }]; NAV.page = null; closeWork(); drawLeft(); } else { NAV.page = p.id; openFrame(p); drawLeft(); } }));
    return;
  }
  // Stores drill-down
  const crumb = h('div', { className: 'crumb' });
  crumb.append(h('button', { textContent: '← ' + NAV.area, onclick: () => { if(!leaveOk()) return; NAV.path = []; NAV.page = null; closeWork(); drawLeft(); } }));
  NAV.path.forEach((st, i) => { if(i < NAV.path.length - 1) crumb.append(h('button', { textContent: st.label, onclick: () => { if(!leaveOk()) return; NAV.path = NAV.path.slice(0, i + 1); NAV.page = null; NAV.find = ''; closeWork(); drawLeft(); } })); });
  L.append(crumb);
  L.append(h('div', { className: 'cap', textContent: 'Loading…' }));
  try{ await loadStores(); }catch(e){ L.lastChild.textContent = 'Could not load stores: ' + e.message; return; }
  L.lastChild.remove();
  const town = (NAV.path[1] || {}).v, type = (NAV.path[2] || {}).v, sid = (NAV.path[3] || {}).v;
  const step = (k, label, v) => { if(!leaveOk()) return; NAV.path.push({ k, label, v }); NAV.find = ''; NAV.page = null; closeWork(); drawLeft(); };
  if(NAV.path.length === 1){
    L.append(h('div', { className: 'cap', textContent: 'Which town' }));
    const towns = {}; for(const s of DATA.stores) towns[storeTown(s)] = (towns[storeTown(s)] || 0) + 1;
    for(const t of Object.keys(towns).sort((a, b) => towns[b] - towns[a])) L.append(pgBtn(t, '', false, () => step('town', t, t), towns[t]));
  } else if(NAV.path.length === 2){
    L.append(h('div', { className: 'cap', textContent: town + ' — which type' }));
    for(const [id, name] of TYPES){ const n = DATA.stores.filter(s => storeTown(s) === town && storeType(s) === id).length; L.append(pgBtn(name, '', false, () => step('type', name, id), n)); }
  } else if(NAV.path.length === 3){
    L.append(h('div', { className: 'cap', textContent: 'Which store' }));
    const f = h('input', { id: 'find', placeholder: 'Find a store…', value: NAV.find, oninput: () => { NAV.find = f.value; list(); } }); L.append(f);
    const box = h('div'); L.append(box);
    const list = () => { box.textContent = ''; const q = NAV.find.toLowerCase();
      const rows = DATA.stores.filter(s => storeTown(s) === town && storeType(s) === type && (!q || s.name.toLowerCase().includes(q)));
      if(!rows.length) box.append(h('div', { className: 'cap', textContent: 'No stores here' }));
      for(const s of rows){ const nb = (DATA.boards[s.id] || []).length; box.append(pgBtn(s.name, nb ? nb + ' board panels ready' : (s.address || '').split(',')[0], false, () => step('store', s.name, s.id))); } };
    list();
  } else {
    const s = DATA.stores.find(x => x.id === sid) || { name: 'Store' };
    L.append(h('div', { className: 'cap', textContent: s.name + ' — its pages' }));
    const panels = DATA.boards[sid] || [];
    for(const p of panels){ const id = 'board:' + sid + ':' + p.daypart + ':' + p.panel_no;
      L.append(pgBtn('Menu board ' + p.panel_no, (p.daypart === 'allday' ? 'All day' : p.daypart) + ' · ' + p.mode, NAV.page === id, () => { if(!leaveOk()) return; NAV.page = id; openBoard(s, p); drawLeft(); })); }
    L.append(pgBtn('Store page & catalog', 'Products, names, prices, images', NAV.page === 'sp:' + sid, () => { if(!leaveOk()) return; NAV.page = 'sp:' + sid; openFrame({ name: s.name, url: 'pages.html?page=store&store=' + sid }); drawLeft(); }));
  }
}
function closeWork(){ $('#frameWrap').hidden = true; $('#editor').hidden = true; $('#empty').hidden = false; $('#frame').src = 'about:blank'; ED.page = null; }
function openFrame(p){
  $('#empty').hidden = true; $('#editor').hidden = true; $('#frameWrap').hidden = false; ED.page = null;
  $('#frame').src = p.url + (p.url.includes('?') ? '&' : '?') + 'embed=1';
}

// the page opens with only its own phone and its own tools: no other area's pages, no second top bar
const FRAME_CSS = `header.top,nav.app-tabs,nav.left,nav.studio-page-navigation,.ctitle,#hint,.workspace-crumbs,#pagePick{display:none!important}
html,body{height:100%!important;overflow:hidden!important}
main{position:fixed!important;inset:0!important;height:100vh!important;display:grid!important;grid-template-columns:minmax(300px,440px) minmax(0,1fr)!important}
main>section.center{grid-column:1!important;height:100vh!important;min-height:0!important;padding:8px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}
main>section.center .phonewrap{flex:1 1 auto!important;min-height:0!important;height:100%!important;display:flex!important;align-items:flex-start!important;justify-content:center!important;overflow:auto!important}
main>aside.right{grid-column:2!important;height:100vh!important;min-height:0!important}`;
function dressFrame(){
  const f = $('#frame'); let d; try{ d = f.contentDocument; }catch(e){ return; }
  if(!d || !d.body || d.getElementById('claudeShell')) return;
  const st = d.createElement('style'); st.id = 'claudeShell'; st.textContent = FRAME_CSS; d.head.append(st);
  const fit = () => { const ph = d.querySelector('.phone'), wrap = d.querySelector('.phonewrap'); if(!ph || !wrap) return;
    ph.style.zoom = ''; ph.style.transform = 'none'; const r = ph.getBoundingClientRect(), k = Math.min((wrap.clientHeight - 6) / r.height, (wrap.clientWidth - 6) / r.width);
    if(isFinite(k) && k > 0){ ph.style.transformOrigin = 'top center'; ph.style.transform = 'scale(' + k + ')'; ph.style.flex = 'none'; } };
  const sel = d.querySelector('.phone-size-control select'); if(sel){ const o = [...sel.options].find(x => /original|100/i.test(x.textContent)); if(o){ sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles: true })); } }

  if(!ED.sel || ED.scope !== 'one') return; const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key]; if(!d) return;
  ev.preventDefault(); const tx = isText(ED.sel.kind), m = ev.shiftKey ? 10 : 1; beginChange(); const bag = targetBag(true);
  bag[tx ? 'dx' : 'x'] = P(ED.sel, tx ? 'dx' : 'x') + d[0] * m; bag[tx ? 'dy' : 'y'] = P(ED.sel, tx ? 'dy' : 'y') + d[1] * m; render(true); syncControls(); endChange();
});
// cut a piece out of the artwork
let cut = null;
function stagePt(ev){ const s = $('#stage').getBoundingClientRect(), k = zoomK(); return { x: (ev.clientX - s.left) / k, y: (ev.clientY - s.top) / k }; }
function startCut(ev){ const p = stagePt(ev); cut = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; const b = h('div', { id: 'cutBox' }); $('#stage').append(b); $('#stage').setPointerCapture(ev.pointerId); ev.preventDefault(); }
function moveCut(ev){ const p = stagePt(ev); cut.x1 = p.x; cut.y1 = p.y; const b = $('#cutBox'); Object.assign(b.style, { left: Math.min(cut.x0, cut.x1) + 'px', top: Math.min(cut.y0, cut.y1) + 'px', width: Math.abs(cut.x1 - cut.x0) + 'px', height: Math.abs(cut.y1 - cut.y0) + 'px' }); }
function endCut(){
  const c = cut; cut = null; ED.cutting = false; const b = $('#cutBox'); if(b) b.remove();
  const x = Math.min(c.x0, c.x1), y = Math.min(c.y0, c.y1), w = Math.abs(c.x1 - c.x0), hh = Math.abs(c.y1 - c.y0); if(w < 6 || hh < 6){ drawEdit(); return; }
  const art = ED.byId.art, ax = P(art, 'x'), ay = P(art, 'y'), aw = P(art, 'w'), ah = P(art, 'h');
  addPiece({ type: 'crop', label: 'Cut piece', src: P(art, 'src'), iw: aw, ih: ah, sx: x - ax, sy: y - ay, sw: w, sh: hh, x, y, w, h: hh });
}
function addPiece(a){
  beginChange(); const pd = panelDoc(true); pd.added = pd.added || [];
  a.id = 'a' + Date.now().toString(36); Object.assign(a, { opacity: 1, brightness: 1, contrast: 1, saturate: 1, hidden: false }, a);
  pd.added.push(a); render(true); endChange(); select(ED.byId[a.id]);
}

/* ============ 3: feature tabs ============ */
function drawFeatures(){
  const f = $('#features'); f.textContent = '';
  const have = new Set(ED.els.map(e => e.kind)); have.add('all'); have.add('added');
  for(const [id, name] of KINDS){ if(!have.has(id)) continue;
    f.append(h('button', { textContent: name, className: ED.kind === id ? 'on' : '', onclick: () => { ED.kind = id; ED.sel = null; ED.group = null; ED.scope = 'board'; drawFeatures(); drawEdit(); paintSel(); } })); }
}

/* ============ 4 + 5: options, then only that control set ============ */
const GROUPS = {
  text: [['size','Size'],['move','Position'],['color','Color'],['font','Font'],['look','See-through'],['show','Show / hide']],
  image: [['size','Size'],['move','Position'],['look','Brightness & look'],['show','Show / hide']],
  slot: [['size','Size'],['move','Position'],['show','Show / hide']],
  added: [['size','Size'],['move','Position'],['look','Brightness & look'],['picture','Picture'],['show','Show / hide'],['remove','Remove this piece']],
  fill: [['size','Size'],['move','Position'],['color','Color'],['look','See-through'],['show','Show / hide'],['remove','Remove this piece']]
};
function groupSet(){ const k = ED.sel ? ED.sel.kind : ED.kind; if(k === 'all') return null; if(k === 'added'){ if(!ED.sel) return null; return ED.sel.type === 'fill' ? GROUPS.fill : GROUPS.added; } return isText(k) ? GROUPS.text : k === 'slot' ? GROUPS.slot : GROUPS.image; }
function drawEdit(){
  const tt = $('#targetText'), sc = $('#scope'), opt = $('#options'), c = $('#controls'); tt.textContent = ''; sc.textContent = ''; opt.textContent = ''; c.textContent = '';
  const kind = ED.sel ? ED.sel.kind : ED.kind;
  if(ED.sel){ tt.append('Editing ', h('b', { textContent: ED.sel.label }), ' (' + KNAME[kind] + ')'); } else tt.append('Editing ', h('b', { textContent: KNAME[kind] }));
  const scopes = []; if(ED.sel) scopes.push(['one', 'Only this one']);
  if(kind !== 'all' && kind !== 'added' && kind !== 'art'){ scopes.push(['board', 'All ' + KNAME[kind].toLowerCase() + ' on this board']); scopes.push(['store', 'All ' + KNAME[kind].toLowerCase() + ' on every board of this store']); }
  if(kind === 'art' && !ED.sel){ scopes.push(['board', 'This board']); }
  if(!scopes.find(s => s[0] === ED.scope)) ED.scope = scopes.length ? scopes[0][0] : 'board';
  for(const [v, t] of scopes) sc.append(h('option', { value: v, textContent: t, selected: v === ED.scope })); sc.hidden = scopes.length < 2;
  $('#bBack').disabled = !(ED.group || ED.sel || ED.kind !== 'all');
  const set = groupSet();
  if(kind === 'all' || (kind === 'added' && !ED.sel)){
    opt.hidden = true; c.append(h('h3', { textContent: kind === 'added' ? 'Added pieces' : ED.store.name + ' — board ' + ED.panel.panel_no }));
    if(kind === 'all') c.append(h('div', { className: 'hint', textContent: 'Click anything on the phone to edit that one piece, or pick a tab above to change every piece of that kind at once. Drag a piece to move it; drag the orange corner to resize it.' }));
    const row = h('div', { className: 'btnrow' });
    row.append(h('button', { className: 'tb', textContent: '+ Add a picture', onclick: () => { const u = prompt('Paste the picture link (URL):'); if(u && /^https?:\/\//.test(u.trim())) addPiece({ type: 'image', label: 'Added picture', src: u.trim(), fit: 'contain', x: 115, y: 120 + $('#scroll').scrollTop, w: 160, h: 160 }); } }));
    row.append(h('button', { className: 'tb', textContent: '✂ Cut a piece out of the artwork', onclick: () => { ED.cutting = true; toast('Drag a box on the phone around the part you want as its own piece', 5000); } }));
    row.append(h('button', { className: 'tb', textContent: '+ Add a color box', onclick: () => addPiece({ type: 'fill', label: 'Color box', color: '#000000', radius: 0, x: 115, y: 120 + $('#scroll').scrollTop, w: 160, h: 80 }) }));
    c.append(row);
    const pd = panelDoc();
    if((pd.added || []).length){ const box = h('div', { className: 'cbox' }); box.style.marginTop = '12px'; box.append(h('h4', { textContent: 'Pieces you added to this board' }));
      for(const a of pd.added) box.append(h('button', { className: 'pg', textContent: a.label, onclick: () => select(ED.byId[a.id]) })); c.append(box); }
    return;
  }
  if(!ED.group){
    opt.hidden = false; for(const [id, name] of set) opt.append(h('button', { textContent: name, onclick: () => { ED.group = id; drawEdit(); } }));
    c.append(h('div', { className: 'hint', textContent: 'Choose what to adjust.' })); return;
  }
  opt.hidden = true;
  const name = (set.find(g => g[0] === ED.group) || [0, ''])[1];
  c.append(h('h3', {}, [name]));
  const boxes = h('div', { className: 'boxes' }); c.append(boxes); buildControls(boxes, ED.group, kind);
}
$('#scope').onchange = e => { ED.scope = e.target.value; drawEdit(); paintSel(); };
$('#bBack').onclick = () => { if(ED.group) ED.group = null; else if(ED.sel){ ED.sel = null; ED.scope = 'board'; } else ED.kind = 'all'; drawFeatures(); drawEdit(); paintSel(); };
$('#bPreview').onclick = () => { const on = document.body.classList.toggle('clean'); $('#bPreview').textContent = on ? 'Back to editing' : 'Preview'; };
function undo(){ if(!ED.hist.length) return; ED.redo.push(JSON.stringify(ED.design)); ED.design = JSON.parse(ED.hist.pop()); render(true); drawEdit(); marks(); }
function redo(){ if(!ED.redo.length) return; ED.hist.push(JSON.stringify(ED.design)); ED.design = JSON.parse(ED.redo.pop()); render(true); drawEdit(); marks(); }
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bSave').onclick = async () => {
  if(!ED.page) return; const b = $('#bSave'); b.disabled = true; b.textContent = 'Saving…';
  try{
    const id = 'el_board_' + ED.store.id, now = new Date().toISOString();
    await rest('studio_designs?on_conflict=id', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, HEAD), body: JSON.stringify({ id, page: 'board_elements', data: ED.design, updated_at: now, updated_by: 'claude-studio' }) });
    const back = await rest('studio_designs?id=eq.' + id + '&select=data,updated_at');
    if(!back[0] || JSON.stringify(back[0].data) !== JSON.stringify(ED.design)) throw new Error('the saved copy did not match');
    ED.saved = JSON.stringify(ED.design); ED.updatedAt = back[0].updated_at; toast('Saved');
  }catch(e){ toast('Save failed: ' + e.message, 6000); }
  b.disabled = false; marks();
};

/* ============ controls ============ */
const live = [];
function syncControls(){ for(const f of live) f(); }
function cbox(parent, title, info){ const b = h('div', { className: 'cbox' }); const t = h('h4', { textContent: title }); if(info) t.append(h('span', { className: 'info', textContent: 'i', title: info })); b.append(t); parent.append(b); return b; }
function slider(box, label, key, min, max, step, fallback){
  const row = h('div', { className: 'ctl' }), r = h('input', { type: 'range', min, max, step }), n = h('input', { type: 'number', min, max, step }), rs = h('button', { className: 'rs', textContent: '↺', title: 'Back to the original' });
  const get = () => { const v = current(key); return v === undefined ? fallback : v; };
  const show = () => { const v = get(); if(document.activeElement !== r) r.value = v; if(document.activeElement !== n) n.value = Math.round(v * 100) / 100; };
  const put = v => { if(!isFinite(v)) return; setProp(key, v); if(document.activeElement !== r) r.value = v; if(document.activeElement !== n) n.value = Math.round(v * 100) / 100; };
  r.oninput = () => put(Number(r.value)); r.onchange = endChange; n.oninput = () => put(Number(n.value)); n.onchange = endChange;
  rs.onclick = () => { setProp(key, undefined); endChange(); show(); };
  row.append(h('label', { textContent: label }), r, n, rs); box.append(row); live.push(show); show();
}
function color(box, label, key){
  const row = h('div', { className: 'ctl' }), c = h('input', { type: 'color' }), t = h('input', { type: 'text' }), rs = h('button', { className: 'rs', textContent: '↺', title: 'Back to the original' });
  const show = () => { const v = String(current(key) || '#ffffff'); c.value = /^#[0-9a-f]{6}$/i.test(v) ? v : '#ffffff'; if(document.activeElement !== t) t.value = v; };
  c.oninput = () => { setProp(key, c.value); t.value = c.value; }; c.onchange = endChange;
  t.onchange = () => { if(/^#[0-9a-f]{6}$/i.test(t.value.trim())){ setProp(key, t.value.trim()); endChange(); show(); } };
  rs.onclick = () => { setProp(key, undefined); endChange(); show(); };
  row.append(h('label', { textContent: label }), c, t, rs); box.append(row); live.push(show); show();
}
function choice(box, label, key, list){
  const row = h('div', { className: 'ctl' }), s = h('select', { className: 'wide' }), rs = h('button', { className: 'rs', textContent: '↺', title: 'Back to the original' });
  for(const [v, t] of list) s.append(h('option', { value: v, textContent: t }));
  const show = () => { s.value = String(current(key)); };
  s.onchange = () => { const raw = s.value, v = raw === 'true' ? true : raw === 'false' ? false : isNaN(raw) || raw === '' ? raw : Number(raw); setProp(key, v); endChange(); };
  rs.onclick = () => { setProp(key, undefined); endChange(); show(); };
  row.append(h('label', { textContent: label }), s, rs); box.append(row); live.push(show); show();
}
function buildControls(root, group, kind){
  live.length = 0; const tx = isText(kind), el = ED.sel;
  if(group === 'size'){
    if(tx){ const b = cbox(root, 'Text size', 'How big the letters are. The app still shrinks text that does not fit its box, the same way the real page does.'); slider(b, 'Size', 'size', 4, 80, 0.5, 14); }
    else { const b = cbox(root, 'Size', 'Width and height on the phone, in phone pixels (the phone is 390 wide).'); slider(b, 'Width', 'w', 4, 1600, 1, 100); slider(b, 'Height', 'h', 4, 3400, 1, 100);
      if(el && ED.scope === 'one' && el.type !== 'slot'){ const b2 = cbox(root, 'Grow or shrink evenly', 'Changes width and height together so the picture is not stretched.'); const row = h('div', { className: 'btnrow' });
        for(const [t, k] of [['− 10%', .9], ['− 2%', .98], ['+ 2%', 1.02], ['+ 10%', 1.1]]) row.append(h('button', { className: 'tb', textContent: t, onclick: () => { beginChange(); const bag = targetBag(true), w = P(el, 'w'), hh = P(el, 'h'), x = P(el, 'x'), y = P(el, 'y'); bag.w = Math.round(w * k * 10) / 10; bag.h = Math.round(hh * k * 10) / 10; bag.x = Math.round((x - (bag.w - w) / 2) * 10) / 10; bag.y = Math.round((y - (bag.h - hh) / 2) * 10) / 10; render(true); endChange(); syncControls(); } }));
        b2.append(row); } }
  }
  if(group === 'move'){
    const b = cbox(root, 'Position', tx ? 'Nudges the text away from where the app normally puts it.' : 'Where the piece sits on the phone. You can also drag it, or use the arrow keys.');
    if(tx){ slider(b, 'Left / right', 'dx', -200, 200, 0.5, 0); slider(b, 'Up / down', 'dy', -200, 200, 0.5, 0); }
    else { slider(b, 'Left / right', 'x', -1600, 800, 0.5, 0); slider(b, 'Up / down', 'y', -3400, 3400, 0.5, 0); }
  }
  if(group === 'color'){ const b = cbox(root, 'Color'); color(b, 'Color', 'color'); if(kind === 'added') slider(b, 'Round corners', 'radius', 0, 200, 1, 0); }
  if(group === 'font'){
    const b = cbox(root, 'Lettering');
    choice(b, 'Font', 'font', [['Roboto', 'Roboto (the app\'s font)'], ['Inter', 'Inter'], ['Oswald', 'Oswald'], ['Bebas Neue', 'Bebas Neue'], ['Cinzel', 'Cinzel (Norse serif)']]);
    choice(b, 'Thickness', 'weight', [[400, 'Regular'], [500, 'Medium'], [600, 'Semi-bold'], [700, 'Bold'], [800, 'Extra bold'], [900, 'Black']]);
    choice(b, 'Slant', 'italic', [[false, 'Upright'], [true, 'Italic']]);
    choice(b, 'Capitals', 'caps', [[false, 'As written'], [true, 'ALL CAPITALS']]);
    slider(b, 'Letter gap', 'spacing', -2, 12, 0.1, 0);
  }
  if(group === 'look'){
    const b = cbox(root, tx || (el && el.type === 'fill') ? 'See-through' : 'Brightness & look'); slider(b, 'See-through', 'opacity', 0, 1, 0.01, 1);
    if(!tx && !(el && el.type === 'fill')){ slider(b, 'Brightness', 'brightness', 0, 2.5, 0.01, 1); slider(b, 'Contrast', 'contrast', 0, 2.5, 0.01, 1); slider(b, 'Color strength', 'saturate', 0, 2.5, 0.01, 1); }
  }
  if(group === 'picture' && el){
    const b = cbox(root, 'Picture', 'Swap the picture this piece shows.');
    if(el.type === 'crop') b.append(h('div', { className: 'hint', textContent: 'This piece is cut from the board artwork.' }));
    else { b.append(h('button', { className: 'tb', textContent: 'Change the picture link', onclick: () => { const u = prompt('Paste the new picture link (URL):', P(el, 'src')); if(u && /^https?:\/\//.test(u.trim())){ setProp('src', u.trim()); endChange(); } } })); choice(b, 'Fit', 'fit', [['contain', 'Whole picture shows'], ['cover', 'Fill the box (crops)'], ['fill', 'Stretch to the box']]); }
  }
  if(group === 'show'){ const b = cbox(root, 'Show / hide', 'Hidden pieces stay in the page and can be shown again here.'); choice(b, 'Visible', 'hidden', [[false, 'Showing'], [true, 'Hidden']]); }
  if(group === 'remove' && el){ const b = cbox(root, 'Remove'); b.append(h('button', { className: 'tb', textContent: 'Remove this piece', onclick: () => { beginChange(); const pd = panelDoc(true); pd.added = (pd.added || []).filter(a => a.id !== el.id); ED.sel = null; ED.kind = 'added'; ED.group = null; render(true); endChange(); drawFeatures(); drawEdit(); } })); }
}

drawAreas(); drawLeft();
