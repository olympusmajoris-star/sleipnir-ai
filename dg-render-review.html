<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DG render review · Sleipnir Studio</title><script src="studio-transfer-config.js"></script>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0d1518;color:#edf3f1}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header,main{padding:14px;max-width:1040px;margin:auto}a{color:#a1e8dc}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}button,select{font:inherit;color:inherit;background:#172226;border:1px solid #304044;border-radius:8px;padding:8px 13px;cursor:pointer}button:focus-visible,.spot:focus-visible{outline:2px solid #a1e8dc}button:disabled{opacity:.4;cursor:auto}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}.control{display:flex;align-items:center;gap:7px}small{color:#a9bcb9}.wrap{display:grid;grid-template-columns:minmax(0,390px) 1fr;gap:24px;align-items:start}.phone{background:#080b0c;border:1px solid #334647;border-radius:22px;max-width:390px;width:100%;overflow:hidden;box-shadow:0 14px 45px #0007}.stage{position:relative;width:100%;overflow:hidden;touch-action:pan-y}.stage img{display:block;width:100%;height:auto}.spot{position:absolute;appearance:none;border:0;border-radius:0;background:transparent;padding:0;color:transparent;cursor:pointer}.spot:hover{background:#ffffff12}.spot.off{cursor:default}.tag{position:absolute;display:grid;place-items:center;pointer-events:none;color:#10211c;background:#f0f4e8;border:1px solid #a4aaa1;border-radius:2px;font-size:12px;line-height:1;transform:translate(-50%,-50%);min-width:34px;min-height:16px;white-space:nowrap;font-weight:700}.floor{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.detail{background:#172226;border:1px solid #304044;border-radius:10px;padding:14px}.detail h2{font-size:16px;margin-top:0}.list{display:grid;gap:5px;max-height:610px;overflow:auto}.list button{text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:10px}.list button span:last-child{white-space:nowrap}dialog{width:min(92vw,360px);border:1px solid #405854;border-radius:18px;background:#162326;color:#edf3f1;padding:20px}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}dialog img{max-width:150px;max-height:180px;display:block;margin:auto;object-fit:contain}dialog h2{font-size:17px}dialog strong{font-size:24px;color:#a1e8dc}#close{float:right}#status{color:#a9bcb9}@media(max-width:720px){.wrap{grid-template-columns:1fr}.phone{margin:auto}.detail{max-width:390px;margin:auto;width:100%}}
input[type=search]{font:inherit;min-width:0;flex:1 1 160px;background:#f5f7f4;color:#16201a;border:1px solid #b7c6b8;border-radius:20px;padding:10px 13px}body[data-embed="1"]{background:transparent}body[data-embed="1"] header,body[data-embed="1"] #store,body[data-embed="1"] #aisle,body[data-embed="1"] .detail,body[data-embed="1"] #copySettings,body[data-embed="1"] .control:has(input[type=range]){display:none}body[data-embed="1"] main{padding:0;max-width:390px}body[data-embed="1"] .controls{padding:8px;margin:0;background:#242a23;border-radius:10px 10px 0 0;gap:6px;font-size:12px}body[data-embed="1"] .controls input[type=search]{flex-basis:100%;font-size:14px}body[data-embed="1"] .wrap{display:block}body[data-embed="1"] .phone{border-radius:0 0 12px 12px;box-shadow:none}body[data-embed="1"] #status{font-size:11px;text-align:center;margin:4px 0;color:#b8c4b9}
</style></head><body><header><a href="store-info.html">‹ Store info</a><h1>Dollar General · Render review</h1><small>Store preview · published and draft displays</small><small id="totals" aria-live="polite"></small></header>
<main><div class="controls"><input id="search" type="search" aria-label="Search product renders" placeholder="Search this aisle…"><select id="store" aria-label="Store format"><option value="0600cb61-45f9-402b-a209-134abdaef10f">Standard Dollar General</option><option value="fea775c8-8612-4f2e-bfc6-70d8e6ace6be">Dollar General Market</option></select><select id="aisle" aria-label="Aisle"><option value="">All rendered aisles</option></select><label class="control"><input type="checkbox" id="popups" checked> Product popups</label><label class="control"><input type="checkbox" id="prices" checked> Shelf prices</label><label class="control">Price tag size <input type="range" id="tagScale" min="75" max="220" step="5" value="140"><output id="tagScaleVal">140%</output></label><label class="control">Price text <input type="range" id="textSize" min="9" max="22" step="1" value="13"><output id="textSizeVal">13px</output></label><button id="copySettings">Copy Dart settings</button></div>
<p id="status" role="status">Loading renders…</p><div class="wrap" id="wrap" hidden><div class="phone"><div class="stage" id="stage"><img id="photo" alt=""></div><div class="floor"><button id="prev">‹</button><small id="count"></small><button id="next">›</button></div></div><section class="detail"><h2 id="title"></h2><small>Tap a product in the actual render, or select it here.</small><div class="list" id="list"></div></section></div></main>
<dialog id="popup"><button id="close" aria-label="Close product information">✕</button><img id="itemPhoto" alt=""><h2 id="itemName"></h2><p id="itemSize"></p><strong id="itemPrice"></strong><p id="itemAisle"></p></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),C=window.StudioTransferConfig,H={apikey:C.key,Authorization:'Bearer '+C.key},base=C.url+'/rest/v1/',media=C.url+'/storage/v1/object/public/menu-images/';
const grocery=/^(Baking & Condiments|Candy & Gum|Chips, Cookies & Snacks|Coffee & Breakfast|Fresh Food & Dairy|Frozen Foods|Meals, Canned Goods & Pantry|Soda, Water & Drinks|Baking Cakes & Mixes|Beverages|Cereal & Breakfast|Coffee & Tea|Food & Beverage|Fresh Food|Frozen Food|Meals & Side Dishes|Snacks & Cookies)$/i;
let renders=[],slots=[],products=new Map(),current=0,revision=0,filtered=[],touch=null;
const params=new URLSearchParams(location.search),wantedAisle=params.get('aisle')||'',embedded=params.get('embed')==='1';if(embedded)document.body.dataset.embed='1';
const fmt=v=>v==null?'Price unavailable':'$'+Number(v).toFixed(2);
const safePhoto=value=>{try{const u=new URL(value);return u.protocol==='https:'?u.href:'';}catch{return '';}};
async function read(table,params){const rows=[];for(let offset=0;;offset+=500){const r=await fetch(base+table+'?'+new URLSearchParams({...params,limit:'500',offset:String(offset)}),{headers:H});if(!r.ok)throw Error(table+' could not load');const batch=await r.json();rows.push(...batch);if(batch.length<500)return rows;}}
function getSetting(k){try{return localStorage.getItem(k)!=='0';}catch{return true;}}
function putSetting(k,v){try{localStorage.setItem(k,v?'1':'0')}catch{}}
$('popups').checked=getSetting('sleipnir-product-popups');$('prices').checked=getSetting('sleipnir-shelf-prices');
function getNumber(k,def,min,max){try{const v=localStorage.getItem(k);return v===null?def:Math.max(min,Math.min(max,Number(v)||def));}catch{return def;}}
function saveNumber(k,v){try{localStorage.setItem(k,String(v));}catch{}}
$('tagScale').value=getNumber('sleipnir-dg-price-scale',140,75,220);$('textSize').value=getNumber('sleipnir-dg-price-text',13,9,22);
function updateControls(){ $('tagScaleVal').textContent=$('tagScale').value+'%';$('textSizeVal').textContent=$('textSize').value+'px'; }
updateControls();$('tagScale').oninput=()=>{saveNumber('sleipnir-dg-price-scale',$('tagScale').value);updateControls();paint();};$('textSize').oninput=()=>{saveNumber('sleipnir-dg-price-text',$('textSize').value);updateControls();paint();};
$('copySettings').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify({priceTagScale:+$('tagScale').value/100,priceTextLogicalPx:+$('textSize').value,productPopupsUserToggle:true,shelfPricesUserToggle:true},null,2));$('copySettings').textContent='Copied';}catch{$('copySettings').textContent='Clipboard unavailable';}};
$('popups').onchange=()=>{putSetting('sleipnir-product-popups',$('popups').checked);if(!$('popups').checked)$('popup').close();paint();};$('prices').onchange=()=>{putSetting('sleipnir-shelf-prices',$('prices').checked);paint();};
function groupSizes(layout,slotCount){if(layout.startsWith('rows:'))return layout.slice(5).split(',').map(Number);const m=/^(\d+)x(\d+)$/.exec(layout);if(m)return Array(Number(m[2])).fill(Number(m[1]));return [slotCount];}
function sale(s){return products.get(s.product_id)||s}
function popup(s){if(!$('popups').checked)return;const p=sale(s);$('itemName').textContent=p.name||'Product';$('itemSize').textContent=p.size||'';$('itemPrice').textContent=fmt(p.price);$('itemAisle').textContent=s.aisle;const url=safePhoto(p.image_url);$('itemPhoto').hidden=!url;$('itemPhoto').src=url||'';$('popup').showModal();}
$('close').onclick=()=>$('popup').close();$('popup').onclick=e=>{if(e.target===$('popup'))$('popup').close()};
function position(el,x,y,w,h){Object.assign(el.style,{left:(x*100)+'%',top:(y*100)+'%',width:(w*100)+'%',height:(h*100)+'%'});}
function paint(){const r=filtered[current];const stage=$('stage');stage.querySelectorAll('.spot,.tag').forEach(e=>e.remove());$('list').replaceChildren();if(!r){$('wrap').hidden=true;$('status').textContent='No rendered displays yet for this selection.';return;}
$('wrap').hidden=false;$('status').textContent=['held','draft'].includes(r.publish_status)?'Studio draft · not live':'Published render';$('photo').src=media+r.image_path.split('/').map(encodeURIComponent).join('/');$('photo').alt=r.aisle+' real product display';$('title').textContent=r.aisle;$('count').textContent=(current+1)+' / '+filtered.length;$('prev').disabled=current===0;$('next').disabled=current>=filtered.length-1;
const rows=slots.filter(s=>s.aisle===r.aisle&&s.render_no===r.render_no).sort((a,b)=>a.slot-b.slot);const counts=groupSizes(r.layout,rows.length);let index=0,top=0;
counts.forEach((n,row)=>{const rowSlots=rows.slice(index,index+n);index+=n;if(!rowSlots.length)return;const midpoint=s=>+s.tag_x+(+s.tag_w)/2;const bottom=Math.max(...rowSlots.map(s=>+s.tag_y+(+s.tag_h)));rowSlots.forEach((s,col)=>{const p=sale(s);const left=col?(midpoint(rowSlots[col-1])+midpoint(s))/2:0;const right=col<rowSlots.length-1?(midpoint(s)+midpoint(rowSlots[col+1]))/2:1;const spot=document.createElement('button');spot.className='spot'+(!$('popups').checked?' off':'');spot.disabled=!$('popups').checked;spot.setAttribute('aria-label',p.name+' '+fmt(p.price));spot.onclick=()=>popup(s);position(spot,left,top,right-left,Math.max(.01,bottom-top));stage.append(spot);
if($('prices').checked&&p.price!=null&&!(r.aisle.toLowerCase().includes('frozen')&&row===counts.length-1)){const tag=document.createElement('span');tag.className='tag';tag.textContent=fmt(p.price);const scale=+$('tagScale').value/100;position(tag,+s.tag_x+(+s.tag_w)/2,+s.tag_y+(+s.tag_h)/2,+s.tag_w*scale,+s.tag_h*scale);tag.style.fontSize=$('textSize').value+'px';tag.style.minWidth=(34*scale/1.4)+'px';tag.style.minHeight=(16*scale/1.4)+'px';stage.append(tag);}
const b=document.createElement('button'),a=document.createElement('span'),price=document.createElement('span');a.textContent=p.name||'Product';price.textContent=fmt(p.price);b.append(a,price);b.onclick=()=>popup(s);b.disabled=!$('popups').checked;$('list').append(b);});top=bottom;});}
function apply(){const a=$('aisle').value,q=$('search').value.toLowerCase().trim();const hits=q?new Set(slots.filter(s=>{const p=sale(s);return [p.name,p.size].join(' ').toLowerCase().includes(q)}).map(s=>s.aisle+'|'+s.render_no)):null;filtered=renders.filter(r=>(!a||r.aisle===a)&&(!hits||hits.has(r.aisle+'|'+r.render_no)));current=0;paint();}
$('search').oninput=apply;
function step(d){const n=Math.max(0,Math.min(filtered.length-1,current+d));if(n!==current){current=n;paint();}}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('aisle').onchange=apply;
$('stage').addEventListener('touchstart',e=>{touch=e.touches[0].clientX},{passive:true});$('stage').addEventListener('touchend',e=>{if(touch!==null){const dx=e.changedTouches[0].clientX-touch;if(Math.abs(dx)>55)step(dx<0?1:-1);touch=null;}},{passive:true});
async function load(){const req=++revision,id=$('store').value;$('status').textContent='Loading renders…';$('wrap').hidden=true;try{const rr=await read('aisle_renders',{store_id:'eq.'+id,select:'store_id,aisle,render_no,image_path,width,height,layout,publish_status',order:'aisle,render_no'});if(req!==revision)return;renders=rr.filter(r=>['held','draft','ready'].includes(r.publish_status)&&(!embedded||!wantedAisle||r.aisle===wantedAisle)).sort((a,b)=>Number(!grocery.test(a.aisle))-Number(!grocery.test(b.aisle))||a.aisle.localeCompare(b.aisle)||a.render_no-b.render_no);const byAisle=new Map();for(const r of renders){if(!byAisle.has(r.aisle))byAisle.set(r.aisle,[]);byAisle.get(r.aisle).push(r.render_no);}const result=await Promise.all([...byAisle].map(([aisle,nos])=>read('aisle_slots',{store_id:'eq.'+id,aisle:'eq.'+aisle,render_no:'in.('+nos.join(',')+')',select:'aisle,render_no,slot,product_id,tag_x,tag_y,tag_w,tag_h',order:'render_no,slot'})));if(req!==revision)return;slots=result.flat();const ids=[...new Set(slots.map(s=>s.product_id))];$('totals').textContent=renders.length+' rendered displays · '+ids.length+' linked products';products=new Map();for(let i=0;i<ids.length;i+=250){const batches=[];for(let j=i;j<Math.min(ids.length,i+250);j+=50)batches.push(read('products',{id:'in.('+ids.slice(j,j+50).join(',')+')',store_id:'eq.'+id,select:'id,name,description,price,image_url',order:'id'}));const result=await Promise.all(batches);if(req!==revision)return;result.flat().forEach(p=>products.set(p.id,{...p,size:p.description||''}));}$('aisle').replaceChildren(new Option('All rendered aisles',''));[...new Set(renders.map(r=>r.aisle))].forEach(a=>$('aisle').append(new Option(a,a)));if([...$('aisle').options].some(o=>o.value===wantedAisle))$('aisle').value=wantedAisle;apply();const wantedNo=Number(params.get('render_no'));if(wantedNo){const found=filtered.findIndex(r=>r.aisle===wantedAisle&&r.render_no===wantedNo);if(found>=0){current=found;paint();}}}catch(e){if(req===revision)$('status').textContent=e.message;}}
$('store').onchange=load;const want=params.get('store');if([...$('store').options].some(o=>o.value===want))$('store').value=want;load();
})();
</script></body></html>
