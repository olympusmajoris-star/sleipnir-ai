<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DG grocery render review · Sleipnir Studio</title><script src="studio-transfer-config.js"></script>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0d1518;color:#edf3f1}*{box-sizing:border-box}body{margin:0}header,main{padding:14px;max-width:1040px;margin:auto}a{color:#a1e8dc}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}button,select{font:inherit;color:inherit;background:#172226;border:1px solid #304044;border-radius:8px;padding:8px 13px;cursor:pointer}button:focus-visible,.spot:focus-visible{outline:2px solid #a1e8dc}button:disabled{opacity:.4;cursor:auto}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}.control{display:flex;align-items:center;gap:7px}small{color:#a9bcb9}.wrap{display:grid;grid-template-columns:minmax(0,390px) 1fr;gap:24px;align-items:start}.phone{background:#080b0c;border:1px solid #334647;border-radius:22px;max-width:390px;width:100%;overflow:hidden;box-shadow:0 14px 45px #0007}.stage{position:relative;width:100%;overflow:hidden;touch-action:pan-y}.stage img{display:block;width:100%;height:auto}.spot{position:absolute;appearance:none;border:0;border-radius:0;background:transparent;padding:0;color:transparent;cursor:pointer}.spot:hover{background:#ffffff12}.spot.off{cursor:default}.tag{position:absolute;display:grid;place-items:center;pointer-events:none;color:#10211c;background:#f0f4e8;border:1px solid #a4aaa1;border-radius:2px;font-size:clamp(7px,2.5vw,11px);line-height:1;white-space:nowrap;font-weight:700}.floor{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.detail{background:#172226;border:1px solid #304044;border-radius:10px;padding:14px}.detail h2{font-size:16px;margin-top:0}.list{display:grid;gap:5px;max-height:610px;overflow:auto}.list button{text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:10px}.list button span:last-child{white-space:nowrap}dialog{width:min(92vw,360px);border:1px solid #405854;border-radius:18px;background:#162326;color:#edf3f1;padding:20px}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}dialog img{max-width:150px;max-height:180px;display:block;margin:auto;object-fit:contain}dialog h2{font-size:17px}dialog strong{font-size:24px;color:#a1e8dc}#close{float:right}#status{color:#a9bcb9}@media(max-width:720px){.wrap{grid-template-columns:1fr}.phone{margin:auto}.detail{max-width:390px;margin:auto;width:100%}}
</style></head><body><header><a href="store-info.html">‹ Store info</a><h1>Dollar General · Grocery renders</h1><small>Studio review · not live in the app</small></header>
<main><div class="controls"><select id="store" aria-label="Store format"><option value="0600cb61-45f9-402b-a209-134abdaef10f">Standard Dollar General</option><option value="fea775c8-8612-4f2e-bfc6-70d8e6ace6be">Dollar General Market</option></select><select id="aisle" aria-label="Aisle"><option value="">All rendered grocery aisles</option></select><label class="control"><input type="checkbox" id="popups" checked> Product popups</label><label class="control"><input type="checkbox" id="prices" checked> Shelf prices</label></div>
<p id="status" role="status">Loading renders…</p><div class="wrap" id="wrap" hidden><div class="phone"><div class="stage" id="stage"><img id="photo" alt=""></div><div class="floor"><button id="prev">‹</button><small id="count"></small><button id="next">›</button></div></div><section class="detail"><h2 id="title"></h2><small>Tap a product in the actual render, or select it here.</small><div class="list" id="list"></div></section></div></main>
<dialog id="popup"><button id="close" aria-label="Close product information">✕</button><img id="itemPhoto" alt=""><h2 id="itemName"></h2><p id="itemSize"></p><strong id="itemPrice"></strong><p id="itemAisle"></p></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),C=window.StudioTransferConfig,H={apikey:C.key,Authorization:'Bearer '+C.key},base=C.url+'/rest/v1/',media=C.url+'/storage/v1/object/public/menu-images/';
const grocery=/^(Baking & Condiments|Candy & Gum|Chips, Cookies & Snacks|Coffee & Breakfast|Fresh Food & Dairy|Frozen Foods|Meals, Canned Goods & Pantry|Soda, Water & Drinks|Baking Cakes & Mixes|Beverages|Cereal & Breakfast|Coffee & Tea|Food & Beverage|Fresh Food|Frozen Food|Meals & Side Dishes|Snacks & Cookies)$/i;
let renders=[],slots=[],products=new Map(),current=0,revision=0,filtered=[],touch=null;
const fmt=v=>v==null?'Price unavailable':'$'+Number(v).toFixed(2);
const safePhoto=value=>{try{const u=new URL(value);return u.protocol==='https:'?u.href:'';}catch{return '';}};
async function read(table,params){const r=await fetch(base+table+'?'+new URLSearchParams(params),{headers:H});if(!r.ok)throw Error(table+' could not load');return r.json();}
function getSetting(k){try{return localStorage.getItem(k)!=='0';}catch{return true;}}
function putSetting(k,v){try{localStorage.setItem(k,v?'1':'0')}catch{}}
$('popups').checked=getSetting('sleipnir-product-popups');$('prices').checked=getSetting('sleipnir-shelf-prices');
$('popups').onchange=()=>{putSetting('sleipnir-product-popups',$('popups').checked);if(!$('popups').checked)$('popup').close();paint();};$('prices').onchange=()=>{putSetting('sleipnir-shelf-prices',$('prices').checked);paint();};
function groupSizes(layout,slotCount){if(layout.startsWith('rows:'))return layout.slice(5).split(',').map(Number);const m=/^(\d+)x(\d+)$/.exec(layout);if(m)return Array(Number(m[2])).fill(Number(m[1]));return [slotCount];}
function sale(s){return products.get(s.product_id)||s}
function popup(s){if(!$('popups').checked)return;const p=sale(s);$('itemName').textContent=p.name||'Product';$('itemSize').textContent=p.size||'';$('itemPrice').textContent=fmt(p.price);$('itemAisle').textContent=s.aisle;const url=safePhoto(p.image_url);$('itemPhoto').hidden=!url;$('itemPhoto').src=url||'';$('popup').showModal();}
$('close').onclick=()=>$('popup').close();$('popup').onclick=e=>{if(e.target===$('popup'))$('popup').close()};
function position(el,x,y,w,h){Object.assign(el.style,{left:(x*100)+'%',top:(y*100)+'%',width:(w*100)+'%',height:(h*100)+'%'});}
function paint(){const r=filtered[current];const stage=$('stage');stage.querySelectorAll('.spot,.tag').forEach(e=>e.remove());$('list').replaceChildren();if(!r){$('wrap').hidden=true;$('status').textContent='No rendered displays yet for this selection.';return;}
$('wrap').hidden=false;$('status').textContent=r.publish_status==='held'?'Draft · awaiting Studio publication':'Published render';$('photo').src=media+r.image_path.split('/').map(encodeURIComponent).join('/');$('photo').alt=r.aisle+' real product display';$('title').textContent=r.aisle;$('count').textContent=(current+1)+' / '+filtered.length;$('prev').disabled=current===0;$('next').disabled=current>=filtered.length-1;
const rows=slots.filter(s=>s.aisle===r.aisle&&s.render_no===r.render_no).sort((a,b)=>a.slot-b.slot);const counts=groupSizes(r.layout,rows.length);let index=0,top=0;
counts.forEach((n,row)=>{const rowSlots=rows.slice(index,index+n);index+=n;if(!rowSlots.length)return;const midpoint=s=>+s.tag_x+(+s.tag_w)/2;const bottom=Math.max(...rowSlots.map(s=>+s.tag_y+(+s.tag_h)));rowSlots.forEach((s,col)=>{const p=sale(s);const left=col?(midpoint(rowSlots[col-1])+midpoint(s))/2:0;const right=col<rowSlots.length-1?(midpoint(s)+midpoint(rowSlots[col+1]))/2:1;const spot=document.createElement('button');spot.className='spot'+(!$('popups').checked?' off':'');spot.disabled=!$('popups').checked;spot.setAttribute('aria-label',p.name+' '+fmt(p.price));spot.onclick=()=>popup(s);position(spot,left,top,right-left,Math.max(.01,bottom-top));stage.append(spot);
if($('prices').checked&&p.price!=null&&!(r.aisle.toLowerCase().includes('frozen')&&row===counts.length-1)){const tag=document.createElement('span');tag.className='tag';tag.textContent=fmt(p.price);position(tag,+s.tag_x,+s.tag_y,+s.tag_w,+s.tag_h);stage.append(tag);}
const b=document.createElement('button'),a=document.createElement('span'),price=document.createElement('span');a.textContent=p.name||'Product';price.textContent=fmt(p.price);b.append(a,price);b.onclick=()=>popup(s);b.disabled=!$('popups').checked;$('list').append(b);});top=bottom;});}
function apply(){const a=$('aisle').value;filtered=renders.filter(r=>!a||r.aisle===a);current=0;paint();}
function step(d){const n=Math.max(0,Math.min(filtered.length-1,current+d));if(n!==current){current=n;paint();}}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('aisle').onchange=apply;
$('stage').addEventListener('touchstart',e=>{touch=e.touches[0].clientX},{passive:true});$('stage').addEventListener('touchend',e=>{if(touch!==null){const dx=e.changedTouches[0].clientX-touch;if(Math.abs(dx)>55)step(dx<0?1:-1);touch=null;}},{passive:true});
async function load(){const req=++revision,id=$('store').value;$('status').textContent='Loading renders…';$('wrap').hidden=true;try{const rr=await read('aisle_renders',{store_id:'eq.'+id,select:'store_id,aisle,render_no,image_path,width,height,layout,publish_status',order:'aisle,render_no'});if(req!==revision)return;renders=rr.filter(r=>grocery.test(r.aisle));const result=await Promise.all(renders.map(r=>read('aisle_slots',{store_id:'eq.'+id,aisle:'eq.'+r.aisle,render_no:'eq.'+r.render_no,select:'aisle,render_no,slot,product_id,tag_x,tag_y,tag_w,tag_h',order:'slot'})));if(req!==revision)return;slots=result.flat();const ids=[...new Set(slots.map(s=>s.product_id))];products=new Map();for(let i=0;i<ids.length;i+=50){const data=await read('store_info_items',{product_id:'in.('+ids.slice(i,i+50).join(',')+')',store_id:'eq.'+id,select:'product_id,name,size,price,image_url'});if(req!==revision)return;data.forEach(p=>products.set(p.product_id,p));}$('aisle').replaceChildren(new Option('All rendered grocery aisles',''));[...new Set(renders.map(r=>r.aisle))].forEach(a=>$('aisle').append(new Option(a,a)));apply();}catch(e){if(req===revision)$('status').textContent=e.message;}}
$('store').onchange=load;const want=new URLSearchParams(location.search).get('store');if([...$('store').options].some(o=>o.value===want))$('store').value=want;load();
})();
</script></body></html>
