<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Raven Dial Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e13;--panel:#111821;--panel2:#16202b;--line:#233142;--text:#e2eaf3;--mut:#8ea3b8;--acc:#3fd0ae;--hl:#ffc83d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Roboto,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#3b4f66}
button.on{border-color:var(--acc);background:#123029;color:#bff3e6}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number]{background:#0c1219;border:1px solid var(--line);border-radius:7px;padding:4px 6px}
#app{display:grid;grid-template-columns:auto 1fr;height:100%}
#stageWrap{position:relative;height:100%;padding:10px;display:flex;align-items:center;justify-content:center;background:#04060a;border-right:1px solid var(--line)}
#stage{display:block;border-radius:24px;background:#000;touch-action:none;box-shadow:0 0 0 1px #1c2734}
#stageWrap.pick #stage{cursor:crosshair}
#side{display:flex;flex-direction:column;min-width:0;height:100%}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#crumb{font-weight:500;margin-right:auto;font-size:14px}
#crumb small{color:var(--mut);font-weight:400}
#status{color:var(--mut);font-size:12px;padding:0 10px 6px;min-height:20px}
#tabs,#chips{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tabs button{padding:7px 12px}
#chips button{padding:5px 10px;font-size:12px;border-radius:999px}
#work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,580px) minmax(260px,380px);gap:14px;padding:12px;overflow:hidden;align-content:start}
#controls{overflow:auto;max-height:100%;padding-right:4px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.boxHead{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.boxHead b{font-size:14px;font-weight:500;margin-right:auto}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;border:1px solid transparent}
.row:hover,.row.act{background:#172230;border-color:#2c3d52}
.lab{display:flex;align-items:center;gap:6px;min-width:0}
.lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info{width:18px;height:18px;padding:0;border-radius:50%;font-size:11px;line-height:16px;flex:none;color:var(--mut)}
.ctl{display:flex;align-items:center;gap:8px;min-width:0}
.ctl input[type=range]{flex:1;min-width:60px;max-width:220px;accent-color:var(--acc)}
.ctl input[type=number]{width:74px}
.ctl input[type=text]{flex:1;min-width:0}
.ctl input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.unit{color:var(--mut);font-size:11px;min-width:16px}
.rst{width:26px;height:26px;padding:0;color:var(--mut)}
.sw{width:44px;height:24px;border-radius:12px;padding:0;position:relative;background:#26313d}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8ea3b8;transition:left .15s}
.sw.on{background:#1d6b59;border-color:#2aa486}.sw.on::after{left:23px;background:#e6fff8}
.note{grid-column:1/-1;color:var(--mut);font-size:12px;padding:2px 2px 4px 26px}
#zoomBox{display:flex;flex-direction:column;gap:8px}
#zoomWrap{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
#zoom{display:block;width:100%;aspect-ratio:1/1}
#zoomLab{position:absolute;left:8px;top:6px;font-size:11px;color:#cfe;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px}
#zoomHelp{color:var(--mut);font-size:12px}
#legend{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
#legend i{display:inline-block;width:22px;height:0;border-top:2px dashed var(--hl)}
#mobBtns{display:none}
#phoneLink{font-size:12px;color:var(--mut)}
#phoneLink a{color:#9fe}
@media (max-width:820px){
  #app{display:block}
  #stageWrap{position:fixed;inset:0;padding:0;border:0}
  #stage{border-radius:0;box-shadow:none}
  #side{position:fixed;left:0;right:0;bottom:0;height:52vh;background:rgba(10,14,19,.97);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s;z-index:5}
  #side.open{transform:none}
  #work{grid-template-columns:1fr;padding:8px;overflow:auto}
  #zoomBox{display:none}
  #controls{max-height:none;overflow:visible}
  .row{grid-template-columns:118px minmax(0,1fr) 28px}
  #bar .desk{display:none}
  #mobBtns{display:flex;gap:8px;position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:6}
  #mobBtns button{background:rgba(10,14,19,.75);backdrop-filter:blur(6px)}
}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><canvas id="stage"></canvas></div>
  <div id="side">
    <div id="bar">
      <div id="crumb">Asgard › Raven page › Raven dial <small>· from AsgardRaven Dart v60</small></div>
      <button id="bUndo" title="Undo">Undo</button>
      <button id="bRedo" title="Redo">Redo</button>
      <button id="bPick" title="Click a part of the dial to open its controls">Pick part</button>
      <button id="bHl" class="on" title="Show the highlighted edges">Highlights</button>
      <button id="bReplay" title="Play the rise-in again">Replay</button>
      <button id="bClose" title="Play the close animation">Close</button>
      <select id="selPhone" class="desk" title="Phone screen size"></select>
      <button id="bSave" title="Save to the shared studio">Save</button>
    </div>
    <div id="status">Loading…</div>
    <div id="tabs"></div>
    <div id="chips"></div>
    <div id="work">
      <div id="controls"></div>
      <div id="zoomBox">
        <div id="zoomWrap"><canvas id="zoom"></canvas><div id="zoomLab"></div></div>
        <div id="legend"><i></i> dashed gold edge = what the control you're on changes</div>
        <div id="zoomHelp">Close-up of the part you're editing, live. Turn the ring on the phone preview with the mouse; tap inside to confirm.</div>
        <div id="phoneLink"></div>
      </div>
    </div>
  </div>
</div>
<div id="mobBtns"><button id="mPick">Pick part</button><button id="mCtl">Controls</button></div>
<video id="cam" playsinline muted autoplay style="display:none"></video>
<script>
(() => {

const SB = { url: 'https://afnihsdxtisneuyehatw.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmbmloc2R4dGlzbmV1eWVoYXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NjUxMDcsImV4cCI6MjA4NzE0MTEwN30.q94Gw7BVKgyGm-I_XXGaoScVK50MMfQMk2RHms3qhps' };
const DOC_ID = 'raven_dial';
const TAU = Math.PI * 2, D2R = Math.PI / 180;

const $ = id => document.getElementById(id);

/* ---------- colors ---------- */
const hexCache = {};
function rgb(h) { if (Array.isArray(h)) return h; if (hexCache[h]) return hexCache[h]; let s = String(h).replace('#', ''); if (s.length === 3) s = s.split('').map(c => c + c).join(''); const n = parseInt(s.slice(0, 6), 16) || 0; return (hexCache[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]); }
function rgba(h, a) { const c = rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${clamp(a, 0, 1)})`; }
function mix(a, b, t) { a = rgb(a); b = rgb(b); return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
const WHITE = [255, 255, 255];

def('Dial', 'Rise & close', 'dial', 'anim.slide', 'Slide-up share', 'num', .4, { min: .05, max: 1, step: .01, info: 'Part of the rise spent sliding up from the bottom. The ring then keeps sweeping in.' });

def('Ring', 'Bearing', 'ring.bearing', 'bearing.on', 'Inner bearing line', 'bool', true);

def('Ring', 'Tick marks', 'ring.ticks', 'ticks.majorWidth', 'Long tick width', 'num', 1, { min: 0, max: 6, step: .05, unit: 'px' });
def('Ring', 'Tick marks', 'ring.ticks', 'ticks.minorWidth', 'Short tick width', 'num', .65, { min: 0, max: 6, step: .05, unit: 'px' });
def('Ring', 'Tick marks', 'ring.ticks', 'ticks.majorOpacity', 'Long tick strength', 'num', .8, { min: 0, max: 1, step: .01 });
def('Ring', 'Tick marks', 'ring.ticks', 'ticks.minorOpacity', 'Short tick strength', 'num', .42, { min: 0, max: 1, step: .01 });

/* ---------- geometry ---------- */
function metrics() {
  const glassTop = H * P['glass.top'];
  const glassBottom = Math.max(glassTop + 1, H - 8);
  const available = Math.max(1, glassBottom - glassTop - 32);
  const unit = clamp(Math.min((W - 38) / 340, available / 505), .1, 1.25);
  const minY = glassTop + 250 * unit + 8, maxY = glassBottom - 248 * unit - 8;
  const mid = (glassTop + glassBottom) / 2;
  const cy = (maxY < minY ? mid : clamp(mid, minY, maxY)) + P['dial.y'] * unit;
  const cx = W / 2 + P['dial.x'] * unit;
  const m = { unit, glassTop, glassBottom, glassLeft: P['glass.side'], glassRight: W - P['glass.side'], cx, cy, radius: P['dial.size'] * unit, thickness: P['dial.thickness'] * unit };
  m.st = SHAPES.map((_, i) => ({ x: cx + P['s' + i + '.x'] * unit, y: cy + P['s' + i + '.y'] * unit, size: P['s' + i + '.size'] * unit }));
  m.angles = SHAPES.map((_, i) => Math.atan2(P['s' + i + '.y'], P['s' + i + '.x']));
  return m;
}
function nearest(m, a) { let best = 0, dist = Infinity; m.angles.forEach((x, i) => { const d = Math.abs(wrap(a - x)); if (d < dist) { dist = d; best = i; } }); return best; }

function headingColor(m, a) {
  const n = m.angles.length;
  for (let i = 0; i < n; i++) {
    const nx = (i + 1) % n;
    const span = ((m.angles[nx] - m.angles[i]) % TAU + TAU) % TAU;
    const travel = ((a - m.angles[i]) % TAU + TAU) % TAU;
    if (travel <= span) { const f = travel / span, t = f * f * (3 - 2 * f); return mix(P['s' + i + '.color'], P['s' + nx + '.color'], t); }

}

const cam = $('cam'); let camState = 'off', camFacing = null, camStream = null;
const bgImg = new Image(); let bgLoaded = '';
const tilt = { tx: 0, ty: 0, x: 0, y: 0 };
async function ensureCamera() {
  if (P['bg.mode'] !== 'camera') { stopCamera(); return; }
  if (camState === 'on' && camFacing === P['bg.facing']) return;
  if (camState === 'starting') return;
  stopCamera(); camState = 'starting';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Error('no camera api');
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: P['bg.facing'] }, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    cam.srcObject = camStream; await cam.play().catch(() => {}); camState = 'on'; camFacing = P['bg.facing'];
  } catch (e) { camState = 'failed'; status('Camera not available here (' + (e.name || e.message) + '). Showing black. On the phone, allow the camera.'); }
}
function stopCamera() { if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; camState = P['bg.mode'] === 'camera' && camState === 'failed' ? 'failed' : 'off'; camFacing = null; }

function cover(ctx, src, sw, sh, zoom, ox, oy, mirror) {

}

  const mode = P['bg.mode'];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (P['bg.blur'] > 0) blur(ctx, P['bg.blur']);
  if (mode === 'camera' && camState === 'on' && cam.videoWidth) cover(ctx, cam, cam.videoWidth, cam.videoHeight, 1, 0, 0, P['bg.facing'] === 'user');

function drawGlass(ctx, m, t) {

function makeRow(s) {
  const row = document.createElement('div'); row.className = 'row'; row.dataset.k = s.k;
  const lab = document.createElement('div'); lab.className = 'lab';
  const ib = document.createElement('button'); ib.className = 'info'; ib.textContent = 'i'; ib.title = 'What this does';
  const ls = document.createElement('span'); ls.textContent = s.label; ls.title = s.label;
  lab.append(ib, ls);
  const ctl = document.createElement('div'); ctl.className = 'ctl';
  const rst = document.createElement('button'); rst.className = 'rst'; rst.textContent = '↺'; rst.title = 'Back to original: ' + shownDefault(s);
  const note = document.createElement('div'); note.className = 'note'; note.style.display = 'none';

  let refresh;
  if (s.type === 'num' || s.type === 'int') {
    const r = document.createElement('input'); r.type = 'range'; r.min = s.min; r.max = s.max; r.step = s.step || (s.type === 'int' ? 1 : .01);
    const n = document.createElement('input'); n.type = 'number'; n.step = r.step; n.min = s.min; n.max = s.max;
    const un = document.createElement('span'); un.className = 'unit'; un.textContent = s.unit || '';
    refresh = () => { r.value = P[s.k]; n.value = fmt(P[s.k], s); };
    r.oninput = () => setVal(s.k, s.type === 'int' ? Math.round(+r.value) : +r.value);
    r.onchange = () => commit();
    n.onchange = () => { let v = +n.value; if (!isFinite(v)) v = s.def; setVal(s.k, s.type === 'int' ? Math.round(v) : v); commit(); };
    ctl.append(r, n, un);
  } else if (s.type === 'bool') {
    const b = document.createElement('button'); b.className = 'sw';
    refresh = () => { b.classList.toggle('on', !!P[s.k]); b.title = P[s.k] ? 'On' : 'Off'; };
    b.onclick = () => { setVal(s.k, !P[s.k]); commit(); };
    const t = document.createElement('span'); t.className = 'unit'; ctl.append(b, t);
    const r0 = refresh; refresh = () => { r0(); t.textContent = P[s.k] ? 'On' : 'Off'; };
  } else if (s.type === 'color') {
    const c = document.createElement('input'); c.type = 'color';
    const tx = document.createElement('input'); tx.type = 'text'; tx.style.maxWidth = '96px';
    refresh = () => { c.value = String(P[s.k]).slice(0, 7); tx.value = String(P[s.k]).toUpperCase(); };
    c.oninput = () => setVal(s.k, c.value.toUpperCase()); c.onchange = () => commit();
    tx.onchange = () => { const v = tx.value.trim(); if (/^#?[0-9a-f]{6}$/i.test(v)) { setVal(s.k, ('#' + v.replace('#', '')).toUpperCase()); commit(); } else refresh(); };
    ctl.append(c, tx);
  } else if (s.type === 'select') {
    const sel = document.createElement('select');
    s.opts.forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); });
    refresh = () => { sel.value = String(P[s.k]); };
    sel.onchange = () => { const v = typeof s.def === 'number' ? +sel.value : sel.value; setVal(s.k, v); commit(); };
    ctl.append(sel);
  } else {
    const tx = document.createElement('input'); tx.type = 'text';
    refresh = () => { if (document.activeElement !== tx) tx.value = P[s.k]; };
    tx.oninput = () => setVal(s.k, tx.value); tx.onchange = () => commit();
    ctl.append(tx);
  }
  rst.onclick = () => { setVal(s.k, s.def); commit(); };
  const r1 = refresh; refresh = () => { r1(); rst.disabled = JSON.stringify(P[s.k]) === JSON.stringify(s.def); };
  refresh(); rowRefs[s.k] = refresh;
  const tgt = s.target;
  row.addEventListener('pointerenter', () => { hover = tgt; hoverUntil = Infinity; row.classList.add('act'); });
  row.addEventListener('pointerleave', () => { if (hover === tgt) hoverUntil = performance.now() + (isMobile ? 1500 : 0); row.classList.remove('act'); });
  row.addEventListener('focusin', () => { hover = tgt; hoverUntil = Infinity; });
  row.addEventListener('focusout', () => { hoverUntil = performance.now() + 1200; });
  row.addEventListener('touchstart', () => { hover = tgt; hoverUntil = Infinity; }, { passive: true });
  row.addEventListener('touchend', () => { hoverUntil = performance.now() + 1500; }, { passive: true });
  row.append(lab, ctl, rst, note);
  return row;
}

/* ---------- values, undo, save ---------- */
let hist = [], hi = -1, dirty = false, saveTimer = null, lastSaved = '';
function setVal(k, v, refreshRow = true) {
  P[k] = v; dirty = true;
  if (/^s\d\.(x|y)$/.test(k) && !ST.grab && !ST.turn.on) { const m = metrics(); ST.angle = m.angles[ST.hi]; }
  if (k === 'bg.mode' || k === 'bg.facing') ensureCamera();
  if (refreshRow && rowRefs[k]) rowRefs[k]();
}
function snapshot() { return JSON.stringify(P); }
function commit() {
  const s = snapshot(); if (hist[hi] === s) return;
  hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 300) hist.shift(); hi = hist.length - 1;
  Object.values(rowRefs).forEach(f => f()); updUndo();
  localSet('values', diff()); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(true), 1500);
}
function applySnap(s) { P = Object.assign({}, DEF, JSON.parse(s)); ensureCamera(); const m = metrics(); if (!ST.grab) ST.angle = m.angles[ST.hi]; Object.values(rowRefs).forEach(f => f()); buildControls(); }
function updUndo() { $('bUndo').disabled = hi <= 0; $('bRedo').disabled = hi >= hist.length - 1; }
$('bUndo').onclick = () => { if (hi > 0) { hi--; applySnap(hist[hi]); updUndo(); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(true), 1500); } };
$('bRedo').onclick = () => { if (hi < hist.length - 1) { hi++; applySnap(hist[hi]); updUndo(); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(true), 1500); } };
function diff() { const o = {}; for (const k in P) if (JSON.stringify(P[k]) !== JSON.stringify(DEF[k])) o[k] = P[k]; return o; }
function status(t) { $('status').textContent = t; }
function localGet(k) { try { return JSON.parse(localStorage.getItem('ravenDial1119.' + k)); } catch (e) { return null; } }
function localSet(k, v) { try { localStorage.setItem('ravenDial1119.' + k, JSON.stringify(v)); } catch (e) {} }
async function save(auto) {
  const values = diff(), body = JSON.stringify(values);
  if (auto && body === lastSaved) return;
  try {
    const r = await fetch(SB.url + '/rest/v1/studio_designs?on_conflict=id', { method: 'POST', headers: { apikey: SB.key, Authorization: 'Bearer ' + SB.key, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ id: DOC_ID, page: 'raven_dial', data: { schema: 1, widget: 'AsgardRaven', part: 'Raven dial', source: 'shared board #40, ASGARD RAVEN v60 (2026-11-14)', values, changed: Object.keys(values).length }, updated_by: 'raven-dial-studio-1119', updated_at: new Date().toISOString() }) });
    if (!r.ok) throw Error('HTTP ' + r.status);
    lastSaved = body; dirty = false;
    status('Saved to the shared studio ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' · ' + Object.keys(values).length + ' setting(s) changed from the Dart.');
  } catch (e) { status('Not saved to the shared studio (' + e.message + '). Your changes are kept on this device.'); }
}
$('bSave').onclick = () => save(false);
async function load() {
  let values = null, src = '';
  try {
    const r = await fetch(SB.url + '/rest/v1/studio_designs?id=eq.' + DOC_ID + '&select=data,updated_at', { headers: { apikey: SB.key, Authorization: 'Bearer ' + SB.key } });
    if (r.ok) { const j = await r.json(); if (j[0]) { values = j[0].data?.values || {}; src = 'shared studio'; lastSaved = JSON.stringify(values); } }
  } catch (e) {}
  if (!values) { values = localGet('values'); if (values) src = 'this device'; }
  if (values) for (const k in values) if (k in DEF) P[k] = values[k];
  hist = [snapshot()]; hi = 0; updUndo();
  status(src ? 'Loaded your saved settings from the ' + src + '. Everything starts at the Dart values where you haven\'t changed it.' : 'All values are the Dart originals. Changes save automatically.');
}

/* ---------- toolbar ---------- */
function setPick(on) { pickMode = on; $('bPick').classList.toggle('on', on); $('mPick').classList.toggle('on', on); $('stageWrap').classList.toggle('pick', on); if (on) status('Pick part: tap any part of the dial to open its controls. Press Pick part again to go back to turning the ring.'); }
$('bPick').onclick = () => setPick(!pickMode); $('mPick').onclick = () => setPick(!pickMode);
$('bHl').onclick = () => { showHL = !showHL; $('bHl').classList.toggle('on', showHL); };
$('bReplay').onclick = replay; $('bClose').onclick = closeDial;
$('mCtl').onclick = () => $('side').classList.toggle('open');
$('phoneLink').innerHTML = 'On the phone, open:<br><a href="' + location.href.split('#')[0] + '">' + location.href.split('#')[0] + '</a>';

/* ---------- loop ---------- */
let last = performance.now(), frame = 0;
function update(now) {
  const dt = clamp((now - last) / 1000, 0, .08); last = now;
  if (frozen) return;
  if (ST.rise.mode === 'fwd') { ST.rise.v = clamp((now - ST.rise.t0) / P['anim.rise'], 0, 1); if (ST.rise.v >= 1) ST.rise.mode = 'done'; }
  else if (ST.rise.mode === 'rev') { ST.rise.v = Math.max(0, ST.rise.from - (now - ST.rise.t0) / P['anim.close']); if (ST.rise.v <= 0) { ST.rise.mode = 'closed'; status('Dial closed. Press Close again or tap the screen to open it.'); } }
  if (ST.turn.on) { const p = clamp((now - ST.turn.t0) / P['feel.snap'], 0, 1); ST.angle = ST.turn.from + (ST.turn.to - ST.turn.from) * ease(p); if (p >= 1) { ST.turn.on = false; if (ST.armed && !ST.closing) { ST.armed = false; ST.ready = true; } } }

  const motor = ST.idle || (P['ring.spinAfterGrab'] && !ST.grab);
  if (motor && P['ring.spinOn'] && ST.rise.v >= 1 && !ST.turn.on && !ST.closing) ST.spin += dt * TAU / Math.max(.5, P['ring.spinPeriod']) * P['ring.spinDir'];
  const s = P['bg.smooth']; tilt.x = tilt.x * s + tilt.tx * (1 - s); tilt.y = tilt.y * s + tilt.ty * (1 - s);
}
function render(now) {

  sctx.setTransform(k, 0, 0, k, 0, 0); sctx.filter = 'none';
  renderScene(sctx, m, true, now);
  if (!isMobile && (frame % 2 === 0)) {
    const tg = activeTarget() || sectionTarget(), b = targetBounds(m, tg), zs = zoom.width / b.s;
    zctx.setTransform(1, 0, 0, 1, 0, 0); zctx.fillStyle = '#000'; zctx.fillRect(0, 0, zoom.width, zoom.height);
    zctx.setTransform(zs, 0, 0, zs, -b.x * zs, -b.y * zs); zctx.filter = 'none';
    renderScene(zctx, m, true, now);
  }

function loop(now) { update(now); try { render(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }

/* ---------- test hooks ---------- */
window.RVD = { SPEC, DEF, tilt, get P() { return P; }, ST, set: (k, v) => setVal(k, v), metrics, freeze(on) { frozen = on; }, renderNow() { render(performance.now()); }, openSection, setHover(t) { hover = t; hoverUntil = t ? Infinity : 0; }, showHighlights(on) { showHL = on; }, pDown, pMove, pUp, replay, closeDial, save, load };

/* ---------- start ---------- */
(async () => {
  const ph = localGet('phone'); if (ph) $('selPhone').value = ph;
  layout();
  await load();
  try { await document.fonts.load('500 23px Roboto'); await document.fonts.load('400 14px Roboto'); } catch (e) {}
  const m = metrics(); ST.angle = m.angles[ST.hi];
  openSection('Ring', 'Light bands');
  ensureCamera();
  ST.rise.t0 = performance.now(); last = performance.now();
  requestAnimationFrame(loop);
})();
})();
