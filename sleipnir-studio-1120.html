#store-workspace{box-sizing:border-box;position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;color:#edf3f1;background:#0d1518}
#store-workspace[open]{display:flex;flex-direction:column}
#store-workspace::backdrop{background:#080d11}
#store-workspace header{display:flex;align-items:center;gap:8px;border-bottom:1px solid #304044;padding:calc(7px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}
#store-workspace header strong{flex:1}
#store-workspace iframe{border:0;width:100%;flex:1;min-height:0;background:#0d1518}
#store-workspace-phone{display:none}
@media(max-width:820px){
  #store-workspace-desktop{display:none}
  #store-workspace-phone{display:block;position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:6}
}
