<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layers & tools · Sleipnir</title>
<link rel="stylesheet" href="studio-media.css"><style>
*{box-sizing:border-box}html,body{margin:0;background:#0e171d;color:#e5edef;font:14px/1.4 system-ui,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}
header,footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#111e26;border-bottom:1px solid #30414a}header strong{flex:1}button,select,input{font:inherit;color:inherit}button,select,input[type=text],input[type=number]{border:1px solid #38515b;background:#182b34;border-radius:6px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.45}button.primary{background:#99dfe1;color:#132125;font-weight:650}input[type=range]{accent-color:#9cdbdc}main{display:grid;grid-template-columns:minmax(200px,.7fr) minmax(300px,1.3fr);flex:auto}figure{margin:0;background:#091115;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:12px}figcaption{font-size:.8rem;color:#bfd2d8}.artboard{width:min(100%,calc((100dvh - 145px)*.462));position:relative;aspect-ratio:390/844;overflow:hidden;border:1px solid #384b54;background:repeating-conic-gradient(#18242d 0% 25%,#111b22 0% 50%) 0 0 / 24px 24px}
#scene{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}section.controls{padding:18px;min-width:0}#options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.pg-grp summary{display:none}#panel [hidden],[hidden]{display:none!important}#panel input[type=range]{width:min(100%,30rem)}#panel .pg-row{margin:8px 0}#panel .pg-row>label{display:block;margin-bottom:2px}.pg-row select{max-width:100%}.spt-context select{max-width:100%;margin-bottom:8px}.sm-actions{margin-bottom:8px}.note{color:#aec2cc}h1{font-size:1.15rem;margin:0 0 12px}footer{position:sticky;bottom:0;z-index:3;border-top:1px solid #30414a}#status{font-size:.85rem;flex:1}
@media(max-width:680px){main{grid-template-columns:1fr}.artboard{width:min(150px,50vw)}figure{padding:8px}.controls{padding:12px!important}header,footer{padding:8px}}
</style></head><body>
<header><button id="back" type="button">← Back</button><strong id="target"></strong></header>
<main><figure><div id="art" class="artboard"><canvas id="scene" width="390" height="844" aria-label="Layer preview"></canvas></div><figcaption id="caption">Layer preview</figcaption></figure>
<section class="controls"><h1 id="title">Layers & tools</h1><div id="options"></div><div id="panel"></div></section></main>
<footer><button id="undo" disabled>Undo</button><button id="preview">Preview</button><button id="publish" class="primary" disabled>Publish layers</button><button id="reload" hidden>Reload published</button><span id="status" role="status"></span></footer>
<script src="studio-transfer-config.js"></script><script src="studio-auth-core.js"></script><script src="studio-jobs.js"></script><script src="workspace-core.js"></script><script src="studio-media.js"></script><script src="studio-page-tools.js"></script><script src="portable-layer-store.js"></script><script src="portable-layers.js"></script>
</body></html>
